<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">From observation to a useful question</title>
  <desc id="description">Three steps: observe what occurred, ask the person about their needs and preferences, and examine service arrangements and established barriers. Community context prepares questions; it does not establish an individual's preferences.</desc>
  <rect width="1600" height="900" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#15354a">
    <text x="72" y="76" font-size="23" font-weight="700" letter-spacing="2">PEOPLE, ACCESS AND CULTURE</text>
    <text x="72" y="145" font-size="52" font-weight="700">From observation to a useful question</text>
    <path d="M72 181H1528" stroke="#d6e0e5" stroke-width="2"/>
    <g>
      <rect x="72" y="214" width="1456" height="156" rx="12" fill="#ffffff" stroke="#bacbd3" stroke-width="2"/>
      <circle cx="135" cy="285" r="30" fill="#ffffff" stroke="#286a70" stroke-width="3"/>
      <text x="135" y="297" font-size="32" font-weight="700" text-anchor="middle">1</text>
      <text x="192" y="298" font-size="37" font-weight="700">Observe</text>
      <text x="530" y="274" font-size="30"><tspan x="530">What did you actually see or hear?</tspan><tspan x="530" dy="46">Separate the observation from your interpretation.</tspan></text>
    </g>
    <g>
      <rect x="72" y="394" width="1456" height="174" rx="12" fill="#ffffff" stroke="#bacbd3" stroke-width="2"/>
      <circle cx="135" cy="477" r="30" fill="#ffffff" stroke="#286a70" stroke-width="3"/>
      <text x="135" y="489" font-size="32" font-weight="700" text-anchor="middle">2</text>
      <text x="192" y="467" font-size="37" font-weight="700"><tspan x="192">Ask the</tspan><tspan x="192" dy="45">person</tspan></text>
      <text x="530" y="439" font-size="30"><tspan x="530">What matters to them? What communication</tspan><tspan x="530" dy="43">or participation support do they want?</tspan><tspan x="530" dy="43">Identity does not answer these questions.</tspan></text>
    </g>
    <g>
      <rect x="72" y="592" width="1456" height="174" rx="12" fill="#ffffff" stroke="#bacbd3" stroke-width="2"/>
      <circle cx="135" cy="675" r="30" fill="#ffffff" stroke="#286a70" stroke-width="3"/>
      <text x="135" y="687" font-size="32" font-weight="700" text-anchor="middle">3</text>
      <text x="192" y="665" font-size="37" font-weight="700"><tspan x="192">Examine</tspan><tspan x="192" dy="45">the service</tspan></text>
      <text x="530" y="637" font-size="30"><tspan x="530">Check language access, privacy, roles</tspan><tspan x="530" dy="43">and decision-making authority. What barrier</tspan><tspan x="530" dy="43">is established, and who can respond?</tspan></text>
    </g>
    <text x="72" y="822" font-size="28" font-weight="700">Community context prepares questions.</text>
    <text x="72" y="862" font-size="28">It does not establish an individual’s preferences.</text>
  </g>
</svg>
