name: Refresh public LTSS data
on:
  schedule:
    - cron: '15 9 1 * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: refresh-public-ltss
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the DHS data and refresh the application cache
        run: curl --fail --silent --show-error --retry 2 --max-time 180 https://web-production-50d04b26.up.railway.app/api/ltss --output /dev/null
